<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MotoMate</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
<div class="page-wrapper">

  <header class="site-header">
    <h1>&#x1F3CD;&#xFE0F; MotoMate</h1>
    <p class="subtitle">Motorcycle maintenance &amp; safety assistant — answers grounded in the local corpus only.</p>
  </header>

  <!-- Bike profile -->
  <div class="card">
    <div class="card-title">Your Bike</div>
    <div class="bike-grid">
      <div>
        <label for="year">Year</label>
        <input id="year" type="text" placeholder="e.g. 2020" />
      </div>
      <div>
        <label for="make">Make</label>
        <input id="make" type="text" placeholder="e.g. Honda" />
      </div>
      <div>
        <label for="model">Model</label>
        <input id="model" type="text" placeholder="e.g. CB500F" />
      </div>
      <div>
        <label for="mileage">Mileage</label>
        <input id="mileage" type="text" placeholder="e.g. 5000" />
      </div>
    </div>
  </div>

  <!-- Question -->
  <div class="card">
    <div class="card-title">Ask a Question</div>
    <label for="question">Question</label>
    <textarea id="question" rows="3" maxlength="500"
      placeholder="e.g. How often should I change the engine oil?"></textarea>
    <div class="char-count"><span id="char-count">0</span> / 500</div>

    <button id="ask-btn" class="btn-primary" disabled>
      <span class="btn-spinner" style="display:none;"></span>
      <span class="btn-label">Ask MotoMate</span>
    </button>

    <!-- Debug line: shows live field status so you can confirm JS is running -->
    <p id="debug-status" style="margin-top:8px;font-size:0.8rem;color:#999;"></p>
  </div>

  <!-- Raw debug output — shows exact server response before any rendering -->
  <div id="raw-output" style="display:none;margin-top:16px;padding:12px;
    background:#f8f8f8;border:1px solid #ccc;border-radius:6px;
    font-family:monospace;font-size:0.8rem;white-space:pre-wrap;word-break:break-all;">
  </div>

  <!-- Response panel -->
  <div id="response-panel" class="card" style="display:none;">
    <div id="error-box" class="error-box" style="display:none;"></div>
    <div id="answer-section">
      <span id="category-badge" class="badge"></span>
      <div id="answer-text"></div>
      <div id="safety-warning" class="safety-box" style="display:none;"></div>
      <div id="sources-section" class="sources-section" style="display:none;">
        <div class="sources-label">Sources</div>
        <ul id="sources-list" class="sources-list"></ul>
      </div>
    </div>
  </div>

  <!-- Add to corpus -->
  <div class="corpus-section">
    <details class="corpus-details">
      <summary>&#10133; Add to Corpus</summary>
      <div class="corpus-body">
        <p>Paste motorcycle content to extend MotoMate's knowledge. The index rebuilds immediately.</p>
        <label for="corpus-text">Content</label>
        <textarea id="corpus-text" rows="6"
          placeholder="Paste motorcycle content here (min 50 characters)..."></textarea>
        <button id="corpus-btn" class="btn-secondary">Submit to Corpus</button>
        <div id="corpus-status" class="corpus-status"></div>
      </div>
    </details>
  </div>

  <footer class="site-footer">MotoMate &middot; CPSC 254 Final Project</footer>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
